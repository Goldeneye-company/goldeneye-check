# Правила для PHP.

rules:
  - id: ge.php.sql-injection
    languages: [php]
    mode: taint
    severity: ERROR
    message: SQL-запрос собран из $_GET/$_POST
    metadata:
      ge:
        severity: critical
        category: injection
        cwe: CWE-89
        title:
          ru: "SQL-инъекция в запросе к базе данных"
          kk: "Дерекқорға сұраныстағы SQL-инъекция"
          en: "SQL injection in a database query"
        fix:
          ru: "Используйте подготовленные запросы: $stmt = $pdo->prepare('... WHERE id = ?'); $stmt->execute([$id])."
          kk: "Дайындалған сұраныстарды қолданыңыз: $stmt = $pdo->prepare('... WHERE id = ?'); $stmt->execute([$id])."
          en: "Use prepared statements: $stmt = $pdo->prepare('... WHERE id = ?'); $stmt->execute([$id])."
    pattern-sources: &php_sources
      - pattern-either:
          - pattern: $_GET
          - pattern: $_POST
          - pattern: $_REQUEST
          - pattern: $_COOKIE
          - pattern: $_SERVER['HTTP_REFERER']
          - pattern: file_get_contents('php://input')
    pattern-sanitizers:
      - pattern-either:
          - pattern: intval(...)
          - pattern: (int) $X
          - pattern: $DB->quote(...)
          - pattern: mysqli_real_escape_string(...)
      - &php_validated
        patterns:
          - pattern-either:
              - pattern-inside: |
                  if (<... $V(...) ...>) { ... }
              - pattern-inside: |
                  if (<... $V(...) ...>) { ... } else { ... }
          - metavariable-regex:
              metavariable: $V
              regex: ^(is_numeric|is_int|ctype_digit|ctype_alnum|preg_match|filter_var|in_array)$
          - pattern: $X
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: mysqli_query($CONN, $Q, ...)
              - pattern: $DB->query($Q, ...)
              - pattern: $DB->exec($Q)
              - pattern: mysql_query($Q, ...)
              - pattern: pg_query($CONN, $Q)
          - focus-metavariable: $Q

  - id: ge.php.xss
    languages: [php]
    mode: taint
    severity: WARNING
    message: Данные формы выводятся без экранирования
    metadata:
      ge:
        severity: high
        category: injection
        cwe: CWE-79
        title:
          ru: "Вывод данных пользователя без экранирования (XSS)"
          kk: "Пайдаланушы деректерін экрандаусыз шығару (XSS)"
          en: "Unescaped user input in HTML (XSS)"
        fix:
          ru: "Выводите данные через htmlspecialchars($value, ENT_QUOTES, 'UTF-8')."
          kk: "Деректерді htmlspecialchars($value, ENT_QUOTES, 'UTF-8') арқылы шығарыңыз."
          en: "Output data through htmlspecialchars($value, ENT_QUOTES, 'UTF-8')."
    pattern-sources: *php_sources
    pattern-sanitizers:
      - pattern-either:
          - pattern: htmlspecialchars(...)
          - pattern: htmlentities(...)
          - pattern: intval(...)
          - pattern: json_encode(...)
      - *php_validated
    pattern-sinks:
      - pattern-either:
          - pattern: echo ...;
          - pattern: print(...);
          - pattern: printf(...);

  - id: ge.php.command-injection
    languages: [php]
    mode: taint
    severity: ERROR
    message: Команда ОС из данных формы
    metadata:
      ge:
        severity: critical
        category: injection
        cwe: CWE-78
        title:
          ru: "Внедрение команд ОС"
          kk: "Операциялық жүйе командаларын енгізу"
          en: "OS command injection"
        fix:
          ru: "Не передавайте пользовательские данные в shell. Если это необходимо, используйте escapeshellarg() и проверяйте значение по списку допустимых."
          kk: "Пайдаланушы деректерін shell-ге бермеңіз. Бұл қажет болса, escapeshellarg() қолданып, мәнді рұқсат етілген тізім бойынша тексеріңіз."
          en: "Do not pass user data to a shell. If you have to, use escapeshellarg() and check the value against an allowlist."
    pattern-sources: *php_sources
    pattern-sanitizers:
      - pattern: escapeshellarg(...)
      - *php_validated
    pattern-sinks:
      - pattern-either:
          - pattern: system(...)
          - pattern: exec(...)
          - pattern: shell_exec(...)
          - pattern: passthru(...)
          - pattern: popen(...)
          - pattern: proc_open(...)

  - id: ge.php.file-inclusion
    languages: [php]
    mode: taint
    severity: ERROR
    message: include/require из данных формы
    metadata:
      ge:
        severity: critical
        category: injection
        cwe: CWE-98
        title:
          ru: "Подключение файла по имени из запроса"
          kk: "Сұраныстағы атау бойынша файл қосу"
          en: "File inclusion based on request data"
        fix:
          ru: "Подключайте только файлы из заранее заданного списка: $pages = ['home' => 'home.php']; include $pages[$key] ?? 'home.php'."
          kk: "Тек алдын ала берілген тізімдегі файлдарды қосыңыз: $pages = ['home' => 'home.php']; include $pages[$key] ?? 'home.php'."
          en: "Include only files from a fixed list: $pages = ['home' => 'home.php']; include $pages[$key] ?? 'home.php'."
    pattern-sources: *php_sources
    pattern-sanitizers:
      - *php_validated
    pattern-sinks:
      - pattern-either:
          - pattern: include $X;
          - pattern: include_once $X;
          - pattern: require $X;
          - pattern: require_once $X;

  - id: ge.php.mail-header-injection
    languages: [php]
    mode: taint
    severity: WARNING
    message: Заголовки письма собраны из данных формы
    metadata:
      ge:
        severity: high
        category: injection
        cwe: CWE-93
        title:
          ru: "Внедрение заголовков письма"
          kk: "Хат тақырыптарын енгізу"
          en: "Mail header injection"
        fix:
          ru: "Не подставляйте пользовательские данные в заголовки письма. Проверяйте адрес через filter_var(..., FILTER_VALIDATE_EMAIL) и удаляйте переводы строк."
          kk: "Пайдаланушы деректерін хат тақырыптарына қоймаңыз. Мекенжайды filter_var(..., FILTER_VALIDATE_EMAIL) арқылы тексеріп, жол ауыстыру таңбаларын алып тастаңыз."
          en: "Do not put user data into mail headers. Validate addresses with filter_var(..., FILTER_VALIDATE_EMAIL) and strip line breaks."
    pattern-sources: *php_sources
    pattern-sanitizers:
      - pattern: filter_var($X, FILTER_VALIDATE_EMAIL)
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: mail($TO, $SUBJ, $MSG, $H, ...)
          - focus-metavariable: $H

  - id: ge.php.unserialize
    languages: [php]
    mode: taint
    severity: ERROR
    message: unserialize от данных формы
    metadata:
      ge:
        severity: critical
        category: injection
        cwe: CWE-502
        title:
          ru: "unserialize для пользовательских данных"
          kk: "Пайдаланушы деректері үшін unserialize"
          en: "unserialize on user input"
        fix:
          ru: "Для данных извне используйте json_decode вместо unserialize."
          kk: "Сырттан келген деректер үшін unserialize орнына json_decode қолданыңыз."
          en: "Use json_decode instead of unserialize for external data."
    pattern-sources: *php_sources
    pattern-sinks:
      - pattern: unserialize(...)
