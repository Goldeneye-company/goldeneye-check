ServerName localhost

<VirtualHost *:8080>
    DocumentRoot /var/www/html

    <Directory /var/www/html>
        Options -Indexes -FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    # The real client IP is accepted only from the proxy in the internal frontend network (docker-compose.yml).
    RemoteIPHeader X-Forwarded-For
    RemoteIPInternalProxy 172.30.10.0/24

    # The query string is not logged: it carries the link token (ISO 27002: 8.15, 8.12).
    LogFormat "%a %t \"%m %U %H\" %>s %B %D \"%{User-Agent}i\"" ghalam
    CustomLog /proc/self/fd/1 ghalam
    ErrorLog /proc/self/fd/2

    LimitRequestBody 115343360
</VirtualHost>
