# clamd configuration for the clamav/clamav image.
# Difference from the default: the stream and file limits are raised to the GHALAM upload size (100 MB).
# By default clamd accepts streams up to 25 MB, and large files would not be checked.
PidFile /tmp/clamd.pid
LocalSocket /tmp/clamd.sock
TCPSocket 3310
User clamav
LogFile /var/log/clamav/clamd.log
LogTime yes
DatabaseDirectory /var/lib/clamav
StreamMaxLength 110M
MaxFileSize 110M
MaxScanSize 400M
