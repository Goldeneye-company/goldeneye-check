; PHP settings for GHALAM on top of php.ini-production (ISO 27002: 8.9).

; Errors go only to the log, no details are shown to the user
expose_php = Off
display_errors = Off
display_startup_errors = Off
log_errors = On
error_reporting = E_ALL
zend.exception_ignore_args = On

; Network access to URLs from code and running external commands are not needed
allow_url_fopen = Off
allow_url_include = Off
disable_functions = exec,passthru,shell_exec,system,proc_open,popen,pcntl_exec
open_basedir = /var/www:/tmp:/run/secrets

; File uploads: up to 100 MB, temporary files on the data volume, not in memory
file_uploads = On
upload_max_filesize = 100M
post_max_size = 110M
max_file_uploads = 1
upload_tmp_dir = /var/www/data/tmp
max_input_time = 300
max_execution_time = 300
memory_limit = 256M

date.timezone = UTC

; Sessions
session.save_path = /tmp
session.use_strict_mode = 1
session.use_only_cookies = 1
session.use_trans_sid = 0
session.cookie_httponly = 1
session.cookie_samesite = Strict
session.sid_length = 48
session.sid_bits_per_character = 6
session.gc_maxlifetime = 28800
