services:
  app:
    build: .
    ports:
      - "8080:80"
    environment:
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin123!}
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-ghalam}
      DB_USER: ${DB_USER:-ghalam}
      DB_PASSWORD: ${DB_PASSWORD:-ghalam_demo_password}
    volumes:
      - document-data:/var/www/data
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:17-alpine
    ports:
      - "127.0.0.1:5433:5432"
    environment:
      POSTGRES_DB: ${DB_NAME:-ghalam}
      POSTGRES_USER: ${DB_USER:-ghalam}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-ghalam_demo_password}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  document-data:
  postgres-data:

